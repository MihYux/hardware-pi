name: Publish native ARM64 release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            workbench/package-lock.json

      - name: Build companion web
        working-directory: web
        run: |
          npm ci --prefer-offline --no-audit
          npm run build

      - name: Build standalone workbench
        working-directory: workbench
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm ci --prefer-offline --no-audit
          npm run build

      - name: Download Python 3.11 ARM64 wheels
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Prepare Python 3.11 wheelhouse
        run: |
          mkdir -p "${RUNNER_TEMP}/wheels/3.11"
          python -m pip download --only-binary=:all: \
            -r server/requirements.txt \
            -d "${RUNNER_TEMP}/wheels/3.11"

      - name: Download Python 3.12 ARM64 wheels
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Prepare Python 3.12 wheelhouse
        run: |
          mkdir -p "${RUNNER_TEMP}/wheels/3.12"
          python -m pip download --only-binary=:all: \
            -r server/requirements.txt \
            -d "${RUNNER_TEMP}/wheels/3.12"

      - name: Package native runtime
        run: |
          ./deploy/build-native-bundle.sh \
            dist \
            "${GITHUB_SHA}" \
            "$(command -v node)" \
            "${RUNNER_TEMP}/wheels/3.11" \
            "${RUNNER_TEMP}/wheels/3.12"
          sha256sum -c dist/hardware-pi-linux-arm64.tar.gz.sha256
          tar -tzf dist/hardware-pi-linux-arm64.tar.gz | grep -E \
            '^\./(VERSION|runtime/node|server/app/main.py|web/dist/index.html|workbench/server.js)$'

      - name: Publish rolling native release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view native-latest >/dev/null 2>&1; then
            gh release upload native-latest \
              dist/hardware-pi-linux-arm64.tar.gz \
              dist/hardware-pi-linux-arm64.tar.gz.sha256 \
              --clobber
            gh release edit native-latest \
              --title "ReHoYo native ARM64 (latest)" \
              --notes "Rolling native ARM64 release for commit ${GITHUB_SHA}. Docker is not required."
          else
            gh release create native-latest \
              dist/hardware-pi-linux-arm64.tar.gz \
              dist/hardware-pi-linux-arm64.tar.gz.sha256 \
              --target "${GITHUB_SHA}" \
              --prerelease \
              --title "ReHoYo native ARM64 (latest)" \
              --notes "Rolling native ARM64 release for commit ${GITHUB_SHA}. Docker is not required."
          fi
