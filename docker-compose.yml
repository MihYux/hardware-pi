services:
  hardware-pi:
    image: ghcr.io/mihyux/hardware-pi:${HARDWARE_PI_IMAGE_TAG:-latest}
    pull_policy: missing
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "${HARDWARE_PI_PORT:-8000}:8000"
    volumes:
      - ./.data:/data
      - ./.data/bridge:/bridge
    environment:
      MARCH7TH_BRIDGE_DIR: /bridge
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  workbench:
    image: ghcr.io/mihyux/hardware-pi-workbench:${HARDWARE_PI_IMAGE_TAG:-latest}
    pull_policy: missing
    restart: unless-stopped
    depends_on:
      hardware-pi:
        condition: service_healthy
    environment:
      DATA_DIR: /data
      HARDWARE_PI_GATEWAY: "1"
      AI_PROVIDER: deepseek
      DEEPSEEK_API_KEY: ${HARDWARE_PI_SERVICE_TOKEN:-lan-no-auth}
      DEEPSEEK_MODEL: hardware-pi-router
      DEEPSEEK_BASE_URL: http://hardware-pi:8000/api/openai/v1
      ZHIPU_API_KEY: ${HARDWARE_PI_SERVICE_TOKEN:-lan-no-auth}
      GLM_MODEL: hardware-pi-zhipu-router
      GLM_BASE_URL: http://hardware-pi:8000/api/zhipu/v1
      MARCH7TH_BRIDGE_DIR: /bridge
    ports:
      - "${HARDWARE_PI_WORKBENCH_PORT:-3000}:3000"
    volumes:
      - ./.data/workbench:/data
      - ./.data/bridge:/bridge
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/project/current').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
