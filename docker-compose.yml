services:
  hardware-pi:
    build:
      context: .
      dockerfile: Dockerfile
    image: rehoyo/hardware-pi:local
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "${HARDWARE_PI_PORT:-8000}:8000"
    volumes:
      - ./.data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
